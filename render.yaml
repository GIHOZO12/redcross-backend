# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Render reads this when you create a Blueprint from the repo, so the service
# is configured from version control rather than by clicking through the
# dashboard.
#
# No database is declared here on purpose: Postgres lives on Supabase, and
# Render's own free Postgres expires 30 days after creation.

services:
  - type: web
    name: redcross-backend
    runtime: python
    # Frankfurt is Render's EU region - nearest to the Supabase project in
    # London (eu-west-2), which keeps query latency low.
    region: frankfurt
    plan: free
    branch: main
    buildCommand: "./build.sh"
    # 1 worker + threads, not 2 workers: the free instance has 512MB RAM
    # and this app loads Django, boto3, pillow and reportlab into every
    # worker. Threads suit the workload anyway - it is I/O bound waiting
    # on Supabase and R2, not CPU bound.
    startCommand: "gunicorn Umuryango.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120"
    healthCheckPath: /api/healthz/
    envVars:
      # Django 5.1 supports Python 3.10-3.13 only. Without this Render
      # picks its latest default (3.14), which Django 5.1 was never
      # tested against. Also pinned in .python-version, which applies
      # even when the service is not created from this Blueprint.
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Render generates a strong random key and stores it on the service.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      # sync:false = "prompt me for this in the dashboard, never store it in
      # git". Every secret below is entered once at deploy time.
      - key: DATABASE_URL           # Supabase SESSION pooler, port 5432
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_CUSTOM_DOMAIN
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

      # Frontend origins allowed to call the API; comma-separated, no spaces.
      # Both Vercel hostnames serve the same project, so both must be listed -
      # a browser sends whichever one the user actually loaded, and an origin
      # that is not listed gets no Access-Control-Allow-Origin header, which
      # makes every API call fail client-side.
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://redcross-nyarugenge-vert.vercel.app,https://redcross-nyarugenge.vercel.app"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "http://localhost:5173,https://redcross-nyarugenge-vert.vercel.app,https://redcross-nyarugenge.vercel.app"
